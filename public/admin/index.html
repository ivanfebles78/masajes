<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>PausatZen · Administración</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&text=PausatZen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin">
  <main class="acceso" id="vista-acceso" hidden>
    <form class="acceso__caja" id="form-acceso" novalidate>
      <span class="marca__sello" aria-hidden="true">指</span>
      <h1>Administración</h1>
      <p class="aviso" id="aviso-acceso" role="alert" hidden></p>
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" type="text" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="clave">Contraseña</label>
        <input id="clave" name="clave" type="password" autocomplete="current-password" required>
      </div>
      <button class="boton boton--bermellon boton--ancho" type="submit">Entrar</button>
      <a class="acceso__volver" href="/">← Volver a la web</a>
    </form>
  </main>

  <div id="vista-panel" hidden>
    <header class="barra">
      <p class="barra__titulo"><span class="marca__sello" aria-hidden="true">指</span> <span id="nombre-salon">Panel</span></p>
      <nav class="pestanas" role="tablist" aria-label="Secciones">
        <button role="tab" type="button" data-pestana="citas" aria-selected="true">Citas</button>
        <button role="tab" type="button" data-pestana="horario" aria-selected="false">Horario</button>
        <button role="tab" type="button" data-pestana="bloqueos" aria-selected="false">Días cerrados</button>
        <button role="tab" type="button" data-pestana="ajustes" aria-selected="false">Ajustes</button>
      </nav>
      <button class="boton boton--linea" type="button" id="salir">Salir</button>
    </header>

    <main class="lienzo">
      <p class="aviso" id="aviso-panel" role="status" hidden></p>

      <section id="seccion-citas" role="tabpanel">
        <div class="titulo-seccion">
          <h1>Citas</h1>
          <form class="filtro" id="form-filtro">
            <label>Desde <input type="date" id="filtro-desde" name="desde"></label>
            <label>Hasta <input type="date" id="filtro-hasta" name="hasta"></label>
            <label class="filtro__marca"><input type="checkbox" id="filtro-canceladas"> Ver canceladas</label>
            <button class="boton boton--tinta" type="submit">Ver</button>
          </form>
        </div>
        <div id="lista-citas"></div>
      </section>

      <section id="seccion-horario" role="tabpanel" hidden>
        <div class="titulo-seccion">
          <h1>Horario semanal</h1>
          <p class="nota">Los huecos se calculan dentro de cada turno según la duración del masaje.</p>
        </div>
        <form id="form-horario">
          <div class="tabla-horario" id="tabla-horario-admin"></div>
          <button class="boton boton--bermellon" type="submit">Guardar horario</button>
        </form>
      </section>

      <section id="seccion-bloqueos" role="tabpanel" hidden>
        <div class="titulo-seccion">
          <h1>Días cerrados</h1>
          <p class="nota">Festivos, vacaciones o un turno suelto que no quieras ofrecer.</p>
        </div>
        <form class="filtro" id="form-bloqueo">
          <label>Fecha <input type="date" name="fecha" required></label>
          <label>Turno
            <select name="turno">
              <option value="todo">Todo el día</option>
              <option value="manana">Solo mañana</option>
              <option value="tarde">Solo tarde</option>
            </select>
          </label>
          <label>Motivo <input type="text" name="motivo" maxlength="120" placeholder="Festivo, vacaciones…"></label>
          <button class="boton boton--tinta" type="submit">Cerrar ese día</button>
        </form>
        <ul class="lista-bloqueos" id="lista-bloqueos"></ul>
      </section>

      <section id="seccion-ajustes" role="tabpanel" hidden>
        <div class="titulo-seccion"><h1>Ajustes</h1></div>
        <div class="dos-columnas">
          <form class="tarjeta" id="form-ajustes">
            <h2>Datos del salón</h2>
            <div class="campo"><label for="aj-nombre">Nombre del salón</label><input id="aj-nombre" name="nombre_salon" type="text" maxlength="80" required></div>
            <div class="campo"><label for="aj-direccion">Dirección</label><input id="aj-direccion" name="direccion" type="text" maxlength="160"></div>
            <div class="campo"><label for="aj-telefono">Teléfono de contacto</label><input id="aj-telefono" name="telefono_salon" type="text" maxlength="30"></div>
            <div class="campos-dos">
              <div class="campo"><label for="aj-antelacion">Antelación mínima (horas)</label><input id="aj-antelacion" name="antelacion_horas" type="number" min="0" max="72" required></div>
              <div class="campo"><label for="aj-max">Reservar hasta (días vista)</label><input id="aj-max" name="max_dias" type="number" min="1" max="365" required></div>
            </div>
            <button class="boton boton--bermellon" type="submit">Guardar ajustes</button>
          </form>
          <form class="tarjeta" id="form-clave">
            <h2>Cambiar contraseña</h2>
            <div class="campo"><label for="cl-actual">Contraseña actual</label><input id="cl-actual" name="actual" type="password" autocomplete="current-password" required></div>
            <div class="campo"><label for="cl-nueva">Nueva contraseña (mín. 10 caracteres)</label><input id="cl-nueva" name="nueva" type="password" autocomplete="new-password" minlength="10" required></div>
            <div class="campo"><label for="cl-repite">Repite la nueva</label><input id="cl-repite" name="repite" type="password" autocomplete="new-password" minlength="10" required></div>
            <button class="boton boton--tinta" type="submit">Cambiar contraseña</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
